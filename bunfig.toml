# Bun configuration (replaces pnpm-workspace.yaml and .npmrc from the pnpm era).
# Workspace globs, dependency overrides, patches, and the trusted-dependencies
# allowlist live in package.json.

[install]
# Keep dependencies hoisted into a flat node_modules — Electron packaging
# (electron-builder) and the release/app npm ci flow rely on it.
linker = "hoisted"

# Supply chain security: only install package versions published at least
# 7 days ago (unit: seconds, matching pnpm's minimumReleaseAge: 10080 minutes).
minimumReleaseAge = 604800
